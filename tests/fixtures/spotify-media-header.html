<!-- Sanitized structure from Spotify's media header; no hashed classes or song text. -->
<header data-test-media-header>
  <div data-test-media-actions>
    <div role="radiogroup" aria-label="Opções de controle de mídia">
      <button role="radio" value="artwork" aria-checked="false">Artwork</button>
      <button role="radio" value="canvas" aria-checked="false" disabled>Canvas</button>
      <button role="radio" value="hero" aria-checked="false">Artist</button>
      <button role="radio" value="lyrics" aria-checked="true">Lyrics</button>
    </div>
    <button data-testid="more-button">More</button>
  </div>
</header>
